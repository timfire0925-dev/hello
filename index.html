<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>我的個人網站</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      text-align: center;
    }

    .container {
      padding: 80px 20px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2em;
      opacity: 0.9;
    }

    .card {
      background: white;
      color: #333;
      border-radius: 15px;
      padding: 30px;
      margin: 40px auto;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .btn {
      display: inline-block;
      margin: 12px 8px 0;
      padding: 12px 25px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 25px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #5a67d8;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>👋 你好，我是 Tim</h1>
    <p>這是我的第一個 GitHub 個人網站</p>

    <div class="card">
      <h2>關於我</h2>
      <p>我正在學習程式開發 🚀</p>
      <p>未來想做 AI / 網站 / App</p>

      <a class="btn" href="#">聯絡我</a>
      <a class="btn" href="kana.html">日文 50 音練習</a>
    </div>

  </div>

</body>
</html>
