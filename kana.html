<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日文 50 音練習</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,'Noto Sans TC',sans-serif;background:#f8fafc;color:#1e293b}header{padding:24px 20px;background:white;border-bottom:1px solid #e2e8f0}.inner{max-width:980px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px}h1{margin:0;font-size:1.8rem}a{color:#2563eb;text-decoration:none;font-weight:700}main{width:min(980px,calc(100% - 32px));margin:32px auto;display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:24px;align-items:start}section{background:white;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 12px 28px rgba(15,23,42,.08)}.quiz{padding:24px;text-align:center}.score{display:inline-block;padding:10px 16px;margin-bottom:18px;border-radius:8px;background:#f1f5f9;font-weight:700;color:#475569}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:28px}button{border:0;border-radius:8px;padding:12px 14px;background:#e2e8f0;color:#334155;font-weight:700;cursor:pointer;transition:.2s}button:hover{background:#cbd5e1}button.active,.submit{background:#2563eb;color:white}button.active:hover,.submit:hover{background:#1d4ed8}.prompt{margin:0 0 12px;color:#64748b;font-weight:700}.kana{font-size:clamp(5rem,18vw,8rem);line-height:1;margin:0 0 24px;font-weight:800}input{width:100%;padding:16px;border:2px solid #cbd5e1;border-radius:8px;font-size:1.1rem;text-align:center;outline:none}input:focus{border-color:#2563eb}.submit{width:100%;margin-top:12px;font-size:1rem}.feedback{display:none;margin-top:20px;padding:18px;border-radius:8px;text-align:left}.feedback.show{display:block}.feedback.correct{background:#ecfdf5;border:1px solid #bbf7d0}.feedback.wrong{background:#fef2f2;border:1px solid #fecaca}.feedback h2{margin:0 0 14px;font-size:1.2rem;text-align:center}.example{background:white;border:1px solid #e2e8f0;border-radius:8px;padding:14px}.example p{margin:6px 0;line-height:1.5}.speak{width:34px;height:34px;padding:0;margin-left:8px;border-radius:50%;background:#dbeafe;color:#1d4ed8}.table{overflow:hidden}.table h2{margin:0;padding:18px 20px;border-bottom:1px solid #e2e8f0;font-size:1.2rem}.grid{padding:18px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-height:620px;overflow:auto}.tile{min-height:82px;padding:10px;border:1px solid #e2e8f0;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff}.symbols{display:flex;gap:10px;font-size:1.7rem;font-weight:800}.symbols span:first-child{color:#2563eb}.symbols span:last-child{color:#059669}.romaji{margin-top:6px;color:#64748b;font-weight:700}@media(max-width:760px){.inner,main{display:block}header a{display:inline-block;margin-top:10px}.table{margin-top:20px}.grid{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
  <header><div class="inner"><h1>日文 50 音練習</h1><a href="index.html">回首頁</a></div></header>
  <main>
    <section class="quiz">
      <div class="score">分數：<span id="score">0</span> / <span id="total">0</span></div>
      <div class="modes"><button class="mode active" data-mode="hiragana">平假名</button><button class="mode" data-mode="katakana">片假名</button><button class="mode" data-mode="mixed">混合</button></div>
      <p class="prompt" id="prompt">請輸入羅馬拼音</p><div class="kana" id="kana">あ</div>
      <form id="quizForm"><input id="answer" type="text" placeholder="例：a, ka, shi" autocomplete="off" autofocus><button class="submit" type="submit">送出答案</button></form>
      <div class="feedback" id="feedback"></div>
    </section>
    <section class="table"><h2>50 音對照表</h2><div class="grid" id="kanaGrid"></div></section>
  </main>
  <script>
    const rows=[['あ','ア','a','あさ (asa)','早晨','あさ、おきます。','早上起床。'],['い','イ','i','いぬ (inu)','狗','いぬが います。','有一隻狗。'],['う','ウ','u','うみ (umi)','海','うみは おおきいです。','海很大。'],['え','エ','e','えき (eki)','車站','えきへ いきます。','去車站。'],['お','オ','o','おにぎり (onigiri)','飯糰','おにぎりを たべます。','吃飯糰。'],['か','カ','ka','かさ (kasa)','傘','かさを さします。','撐傘。'],['き','キ','ki','きのう (kinou)','昨天','きのうは はれでした。','昨天是晴天。'],['く','ク','ku','くつ (kutsu)','鞋子','くつを かいます。','買鞋子。'],['け','ケ','ke','けいたい (keitai)','手機','けいたいを みます。','看手機。'],['こ','コ','ko','こども (kodomo)','小孩','こどもが あそびます。','小孩在玩耍。'],['さ','サ','sa','さくら (sakura)','櫻花','さくらが きれいです。','櫻花很漂亮。'],['し','シ','shi','しろ (shiro)','白色','しろい くるまです。','白色的車子。'],['す','ス','su','すいか (suika)','西瓜','すいかは おいしいです。','西瓜很好吃。'],['せ','セ','se','せんせい (sensei)','老師','せんせい、おはようございます。','老師早安。'],['そ','ソ','so','そら (sora)','天空','そらが あおいです。','天空很藍。'],['た','タ','ta','たまご (tamago)','雞蛋','たまごを たべます。','吃雞蛋。'],['ち','チ','chi','ちず (chizu)','地圖','ちずを みます。','看地圖。'],['つ','ツ','tsu','つき (tsuki)','月亮','つきが きれいです。','月亮很漂亮。'],['て','テ','te','てがみ (tegami)','信','てがみを かきます。','寫信。'],['と','ト','to','とけい (tokei)','時鐘','とけいを かいます。','買時鐘。'],['な','ナ','na','なつ (natsu)','夏天','なつは あついです。','夏天很熱。'],['に','ニ','ni','にく (niku)','肉','にくを たべます。','吃肉。'],['ぬ','ヌ','nu','ぬの (nuno)','布','ぬので つくります。','用布製作。'],['ね','ネ','ne','ねこ (neko)','貓','ねこが ねています。','貓在睡覺。'],['の','ノ','no','のみもの (nomimono)','飲料','のみものを かいます。','買飲料。'],['は','ハ','ha','はな (hana)','花','はなが さきます。','開花。'],['ひ','ヒ','hi','ひこうき (hikouki)','飛機','ひこうきが とびます。','飛機飛翔。'],['ふ','フ','fu','ふね (fune)','船','ふねに のります。','搭船。'],['へ','ヘ','he','へや (heya)','房間','へやを そうじします。','打掃房間。'],['ほ','ホ','ho','ほん (hon)','書','ほんを よみます。','讀書。'],['ま','マ','ma','まど (mado)','窗戶','まどを あけます。','開窗戶。'],['み','ミ','mi','みず (mizu)','水','みずを のみます。','喝水。'],['む','ム','mu','むら (mura)','村莊','しずかな むらです。','安靜的村莊。'],['め','メ','me','めがね (megane)','眼鏡','めがねを かけます。','戴眼鏡。'],['も','モ','mo','もも (momo)','桃子','ももが すきです。','喜歡桃子。'],['や','ヤ','ya','やま (yama)','山','やまへ いきます。','去山上。'],['ゆ','ユ','yu','ゆき (yuki)','雪','ゆきが ふります。','下雪。'],['よ','ヨ','yo','よる (yoru)','夜晚','よる、ねます。','晚上睡覺。'],['ら','ラ','ra','らいねん (rainen)','明年','らいねん、にほんへ いきます。','明年去日本。'],['り','リ','ri','りんご (ringo)','蘋果','りんごを かいます。','買蘋果。'],['る','ル','ru','るす (rusu)','不在/留守','いま、るすです。','現在不在家。'],['れ','レ','re','れきし (rekishi)','歷史','れきしを べんきょうします。','學習歷史。'],['ろ','ロ','ro','ろく (roku)','數字六','ろくじに おきます。','六點起床。'],['わ','ワ','wa','わたし (watashi)','我','わたしは がくせいです。','我是學生。'],['を','ヲ','wo','を (wo)','助詞（把/將）','ほんを よみます。','讀書。'],['ん','ン','n','しんぶん (shinbun)','報紙','しんぶんを よみます。','讀報紙。']];
    const data=rows.map(([hiragana,katakana,romaji,word,meaning,jp,zh])=>({hiragana,katakana,romaji,example:{word,meaning,sentence:{jp,meaning:zh}}}));
    const state={mode:'hiragana',current:null,score:0,total:0,waitingNext:false};
    const kanaEl=document.getElementById('kana'),promptEl=document.getElementById('prompt'),answerEl=document.getElementById('answer'),scoreEl=document.getElementById('score'),totalEl=document.getElementById('total'),feedbackEl=document.getElementById('feedback'),formEl=document.getElementById('quizForm'),submitEl=formEl.querySelector('.submit');
    function pickQuestion(){const item=data[Math.floor(Math.random()*data.length)];let type=state.mode;if(type==='mixed')type=Math.random()>.5?'hiragana':'katakana';state.current={character:item[type],romaji:item.romaji,type,example:item.example};kanaEl.textContent=state.current.character;promptEl.textContent=`請輸入羅馬拼音（${type==='hiragana'?'平假名':'片假名'}）`;answerEl.value='';answerEl.disabled=false;feedbackEl.className='feedback';feedbackEl.innerHTML='';submitEl.textContent='送出答案';state.waitingNext=false;answerEl.focus()}
    function updateScore(){scoreEl.textContent=state.score;totalEl.textContent=state.total}
    function speak(text){if(!('speechSynthesis'in window)){alert('您的瀏覽器暫不支援語音播放功能。');return}const clean=text.replace(/\([^)]*\)/g,'').trim();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(clean);u.lang='ja-JP';u.rate=1;u.pitch=1;const voice=speechSynthesis.getVoices().find(v=>v.lang.includes('ja')||v.lang.includes('JP'));if(voice)u.voice=voice;speechSynthesis.speak(u)}
    function showFeedback(ok){const ex=state.current.example;feedbackEl.className=`feedback show ${ok?'correct':'wrong'}`;feedbackEl.innerHTML=`<h2>${ok?'答對了！':`答錯了，正確答案是：${state.current.romaji}`}</h2><div class="example"><p><strong>單字：</strong>${ex.word}<button class="speak" type="button" data-speak="${ex.word}" title="播放單字發音">🔊</button></p><p><strong>意思：</strong>${ex.meaning}</p><p><strong>例句：</strong>${ex.sentence.jp}<button class="speak" type="button" data-speak="${ex.sentence.jp}" title="播放例句發音">🔊</button></p><p><strong>中文：</strong>${ex.sentence.meaning}</p></div>`;answerEl.disabled=true;submitEl.textContent='下一題';state.waitingNext=true}
    formEl.addEventListener('submit',e=>{e.preventDefault();if(state.waitingNext){pickQuestion();return}const ans=answerEl.value.trim().toLowerCase();if(!ans)return;const ok=ans===state.current.romaji;state.total++;if(ok)state.score++;updateScore();showFeedback(ok)});
    document.querySelectorAll('.mode').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));btn.classList.add('active');state.mode=btn.dataset.mode;state.score=0;state.total=0;updateScore();pickQuestion()}));
    feedbackEl.addEventListener('click',e=>{const btn=e.target.closest('[data-speak]');if(btn)speak(btn.dataset.speak)});
    document.getElementById('kanaGrid').innerHTML=data.map(item=>`<div class="tile"><div class="symbols"><span>${item.hiragana}</span><span>${item.katakana}</span></div><div class="romaji">${item.romaji}</div></div>`).join('');
    window.speechSynthesis?.getVoices();pickQuestion();
  </script>
</body>
</html>
